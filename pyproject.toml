[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steward"
version = "0.1.0"
description = "Local assistant for managing Linux machines. Uses Ollama or llama.cpp, runs approved commands, and remembers per agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steward contributors" }]
keywords = ["llm", "ollama", "llama.cpp", "agents", "linux", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
steward = "steward.cli.main:main"
steward-gui = "steward.gui.app:main"

[tool.setuptools.packages.find]
include = ["steward*"]

[tool.setuptools.package-data]
steward = ["assets/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
